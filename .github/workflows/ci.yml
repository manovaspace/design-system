name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: manovaspace/ci@v1
        with:
          stack: ts
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Blocking since 1.0 (ADR-038 D4).
      - name: API reports
        run: bun run check:api

      # Blocking since 1.0 (ADR-038 D4).
      - name: Package checks
        run: bun run check:package
