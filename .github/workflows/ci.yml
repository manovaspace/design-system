name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: manovaspace/ci@v1
        with:
          stack: ts
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Blocking gate: API reports must match the committed reports.
      - name: API reports
        run: bun run check:api

      # Blocking gate: package metadata and exports must pass publint and attw.
      - name: Package checks
        run: bun run check:package

      - name: Build Storybook
        run: bun run build-storybook

      - name: Install Chromium for Storybook tests
        run: bun --filter @manovaspace/storybook playwright:install

      # Play functions and a11y checks (headless Chromium, Vitest browser mode).
      - name: Storybook play tests
        run: bun run test:stories

      # Screenshots of the page templates at 390/768/1440 (uses the build above).
      - name: Storybook screenshots
        run: bun run storybook:shots -- --no-build

      # 320px reflow, forced-colors focus, reduced motion and touch targets.
      - name: Storybook corner-case gates
        run: bun run storybook:shots -- --no-build --corner-cases
