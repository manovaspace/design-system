name: Consumer matrix

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: consumer-matrix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'changeset-release/main'
    steps:
      - name: Check matrix token
        id: token
        env:
          MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
        run: |
          if [ -z "$MATRIX_TOKEN" ]; then
            echo "secret not set, skipping"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source SHA
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          sha="$PUSH_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sha="$PR_HEAD_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.enabled == 'true'
        with:
          persist-credentials: false
          ref: ${{ steps.source.outputs.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.enabled == 'true'
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile
        if: steps.token.outputs.enabled == 'true'

      - name: Build and pack the kit
        if: steps.token.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          bun run --filter @manovaspace/tokens build
          bun run --filter @manovaspace/ui build
          mkdir -p "$GITHUB_WORKSPACE/kit-tarballs"
          (cd packages/tokens && bun pm pack --filename "$GITHUB_WORKSPACE/kit-tarballs/manovaspace-tokens.tgz")
          (cd packages/ui && bun pm pack --filename "$GITHUB_WORKSPACE/kit-tarballs/manovaspace-ui.tgz")
          for tarball in manovaspace-tokens.tgz manovaspace-ui.tgz; do
            if [ ! -f "$GITHUB_WORKSPACE/kit-tarballs/$tarball" ]; then
              echo "missing kit tarball: $tarball" >&2
              exit 1
            fi
          done

      # The private handbook repository downloads this artifact with MATRIX_TOKEN
      # and runs the matrix there, so failures stay out of this public log.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.token.outputs.enabled == 'true'
        with:
          name: kit-tarballs-${{ steps.source.outputs.sha }}
          path: kit-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Dispatch the private consumer matrix
        if: steps.token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.MATRIX_TOKEN }}
          SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh workflow run consumer-matrix.yml \
            --repo manovaspace/handbook \
            -f sha="$SHA" \
            -f run_id="$RUN_ID"
