name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    if: github.repository_owner == 'manovaspace'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Require npm 11.5.1 or newer for trusted publishing
        run: |
          v="$(npm --version)"
          printf '%s\n%s\n' "11.5.1" "$v" | sort -V -C || { echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"; exit 1; }
      - run: bun install --frozen-lockfile
      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: bun run release
