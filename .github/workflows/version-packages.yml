name: Version packages

on:
  push:
    branches: [main]

concurrency:
  group: version-packages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository_owner == 'manovaspace'
    steps:
      - name: Check release token
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "secret not set, skipping"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.token.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.token.outputs.enabled == 'true'
        with:
          bun-version: "1.4.4"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.enabled == 'true'
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile
        if: steps.token.outputs.enabled == 'true'

      # No publish input: publishing stays in publish.yml, gated by the npm-publish
      # environment. A PAT is required because pull requests opened with GITHUB_TOKEN
      # do not trigger their own workflows.
      - name: Create or update the Version Packages pull request
        if: steps.token.outputs.enabled == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          version: bun run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
